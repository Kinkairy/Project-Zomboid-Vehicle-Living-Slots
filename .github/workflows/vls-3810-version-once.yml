name: VLS 3.8.10 version correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vls-3810-version-once.yml']
permissions:
  contents: write
jobs:
  correct-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version metadata only; preserve approved R6
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib as H,json,os,pathlib as L,subprocess as S,zipfile
          def git(*a): return S.check_output(['git',*a])
          def sha(b): return H.sha256(b).hexdigest()
          def blob(b): return H.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          repo=os.environ['REPOSITORY']
          prefix,base={'Kinkairy/Project-Zomboid-Vehicle-Living-Slots':('','0c30ab79404340d25a6a54d195e8273d1c0a59b0'),'Kinkairy/project-zomboid':('mods/vehicle-living-slots/','7487d87873997db36a4a20739b910d6d511bfe48')}[repo]
          head=git('rev-parse','HEAD').decode().strip()
          helper='.github/workflows/vls-3810-version-once.yml'
          assert git('diff','--name-only',base,head).decode().splitlines()==[helper]
          root=L.Path(prefix or '.')
          rt='workshop/Contents/mods/'
          def read(rel): return git('cat-file','blob',head+':'+prefix+rel)
          old=json.loads(read('release-3.8.9.json'))
          assert old['runtime_sha256']=='7d27667958d062cfab67b888116b5da9bef0d185f1eb410fad7793d47704f4d3'
          data={n:read(rt+n) for n in old['files']}
          assert len(data)==228 and all(sha(b)==old['files'][n] for n,b in data.items())
          updates={}
          changes={rt+'VehicleLivingSlots/common/media/lua/shared/VLS_Config.lua':[(b'VLS.VERSION = "3.8.9"',b'VLS.VERSION = "3.8.10"'),(b'VLS.BUILD_ID = "release-3.8.9-water-tank-sync-20260921"',b'VLS.BUILD_ID = "release-3.8.10-access-r6-20260922"')],rt+'VehicleLivingSlotsKI5Campers/common/media/lua/shared/VLS_KI5Campers_Config.lua':[(b'VLS.KI5_VERSION = "3.8.9"',b'VLS.KI5_VERSION = "3.8.10"')]}
          for m in ['VehicleLivingSlots','VehicleLivingSlotsKI5Campers']:
              for sub in ['','42.20/']: changes[rt+m+'/'+sub+'mod.info']=[(b'modversion=3.8.9',b'modversion=3.8.10')]
          for rel,pairs in changes.items():
              b=read(rel)
              for a,c in pairs:
                  assert b.count(a)==1,(rel,a)
                  b=b.replace(a,c,1)
              updates[rel]=b
          readme=read('README.md')
          if b'3.8.9' in readme: updates['README.md']=readme.replace(b'3.8.9',b'3.8.10')
          new={n:updates.get(rt+n,b) for n,b in data.items()}
          assert sum(new[n]!=data[n] for n in data)==6
          hashes={n:sha(b) for n,b in sorted(new.items())}
          digest=sha(''.join(h+'  '+n+'\n' for n,h in sorted(hashes.items())).encode())
          manifest=dict(old)
          manifest.update(version='3.8.10',build='release-3.8.10-access-r6',status='awaiting-nuc-validation',files=hashes,runtime_sha256=digest)
          manifest['previous_release_verification']=manifest.pop('verification',{})
          manifest['verification']={'owner_r6_gameplay':'Owner reported all targeted cargo and seat tests passed before version correction.','nuc_3_8_10':'pending','workshop_uploaded':False,'version_only_runtime_changes':6}
          updates['release-3.8.10.json']=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()
          for rel,b in updates.items():
              p=root/rel;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          paths=[prefix+r for r in updates]
          S.run(['git','add','--',*paths],check=True)
          assert set(git('diff','--cached','--name-only').decode().splitlines())==set(paths)
          S.run(['git','-c','user.name=Kinkairy','-c','user.email=55714586+Kinkairy@users.noreply.github.com','commit','-m','chore(vls): correct version to 3.8.10; keep tested R6 behavior'],check=True)
          assert git('ls-remote','origin','refs/heads/main').decode().split()[0]==head
          S.run(['git','push','origin','HEAD:refs/heads/main'],check=True)
          commit=git('rev-parse','HEAD').decode().strip()
          out=L.Path('vls-3810-export');out.mkdir()
          source=dict(updates)
          for r in ['release-3.8.9.json',rt+'VehicleLivingSlots/common/media/lua/client/VLS_Client.lua']: source[r]=read(r)
          records=[{'path':r,'sha256':sha(b),'blob':blob(b)} for r,b in sorted(source.items())]
          pin={'repository':repo,'prefix':prefix,'base_commit':base,'commit':commit,'version':'3.8.10','runtime_sha256':digest,'runtime_file_count':228,'source_files':records,'workshop_uploaded':False}
          (out/'PIN.json').write_text(json.dumps(pin,indent=2)+'\n')
          (out/'release-3.8.10.json').write_bytes(updates['release-3.8.10.json'])
          with zipfile.ZipFile(out/'runtime.zip','w',zipfile.ZIP_DEFLATED) as z:
              for n,b in sorted(new.items()): z.writestr(n,b)
          with zipfile.ZipFile(out/'source-update.zip','w',zipfile.ZIP_DEFLATED) as z:
              for r,b in sorted(source.items()): z.writestr(r,b)
          print('VLS_VERSION_CORRECTED',repo,commit,digest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vls-3810-verified-source
          path: vls-3810-export/
          retention-days: 7
          if-no-files-found: error
