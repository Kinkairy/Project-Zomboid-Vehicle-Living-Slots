name: VLS 3.8.10 metadata correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/vls-version-3810-20260922.yml]
permissions:
  contents: write
jobs:
  correct-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Correct only approved VLS version metadata and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.sha }}
          PROJECT_PREFIX: ''
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          repo = os.environ['REPOSITORY']
          prefix = os.environ['PROJECT_PREFIX']
          parent = os.environ['EXPECTED_HEAD']
          api = 'https://api.github.com/repos/' + repo
          def call(path, data=None, method=None):
              raw = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + path, data=raw, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'User-Agent': 'vls-version-correction'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)
          def digest(data): return hashlib.sha256(data).hexdigest()
          head = call('/git/ref/heads/main')['object']['sha']
          assert head == parent, 'main moved before version correction; no writes'
          commit = call('/git/commits/' + parent)
          tree = call('/git/trees/' + commit['tree']['sha'] + '?recursive=1')
          assert not tree.get('truncated'), 'incomplete tree'
          entries = {e['path']: e for e in tree['tree']}
          def read(rel):
              entry = entries[prefix + rel]
              assert entry['type'] == 'blob' and entry['mode'] == '100644'
              obj = call('/git/blobs/' + entry['sha'])
              assert obj['encoding'] == 'base64'
              return base64.b64decode(obj['content'])
          old_raw = read('release-3.8.9.json')
          old = json.loads(old_raw)
          assert old['version'] == '3.8.9' and old['runtime_file_count'] == 228
          assert old['runtime_sha256'] == '7d27667958d062cfab67b888116b5da9bef0d185f1eb410fad7793d47704f4d3'
          runtime = 'workshop/Contents/mods/'
          runtime_paths = {p[len(prefix + runtime):] for p,e in entries.items()
                           if p.startswith(prefix + runtime) and e['type'] == 'blob'}
          assert runtime_paths == set(old['files']), 'runtime tree differs from pinned manifest'
          def fingerprint(files):
              return digest(''.join(h + '  ' + p + '\n' for p,h in sorted(files.items())).encode())
          assert fingerprint(old['files']) == old['runtime_sha256']
          patches = {}
          hashes = dict(old['files'])
          def replace_runtime(rel, pairs):
              before = read(runtime + rel)
              assert digest(before) == hashes[rel], 'baseline hash differs: ' + rel
              after = before
              for a,b in pairs:
                  a,b = a.encode(),b.encode()
                  assert after.count(a) == 1, 'not a unique metadata replacement: ' + rel
                  after = after.replace(a,b)
              restored = after
              for a,b in reversed(pairs): restored = restored.replace(b.encode(),a.encode())
              assert restored == before, 'non-metadata change'
              patches[runtime + rel] = after
              hashes[rel] = digest(after)
          config = 'VehicleLivingSlots/common/media/lua/shared/VLS_Config.lua'
          client = 'VehicleLivingSlots/common/media/lua/client/VLS_Client.lua'
          assert digest(read(runtime + config)) == '778a25b04fc14bca76b5acc9a944b10fb8aad8c1673d75123aed30d108316d94'
          assert digest(read(runtime + client)) == '038d97ccc44c77ae89650fd35492f38aac0a6dcc42cde341d9410c07b5ab5ffa'
          replace_runtime(config, [('VLS.VERSION = "3.8.9"', 'VLS.VERSION = "3.8.10"'),
              ('VLS.BUILD_ID = "release-3.8.9-water-tank-sync-20260921"',
               'VLS.BUILD_ID = "release-3.8.10-access-r6-20260922"')])
          replace_runtime('VehicleLivingSlotsKI5Campers/common/media/lua/shared/VLS_KI5Campers_Config.lua',
              [('VLS.KI5_VERSION = "3.8.9"', 'VLS.KI5_VERSION = "3.8.10"')])
          for mod in ('VehicleLivingSlots', 'VehicleLivingSlotsKI5Campers'):
              for sub in ('', '42.20/'):
                  replace_runtime(mod + '/' + sub + 'mod.info', [('modversion=3.8.9','modversion=3.8.10')])
          manifest = dict(old)
          manifest.update(version='3.8.10', build='release-3.8.10', files=hashes,
                          runtime_sha256=fingerprint(hashes))
          manifest['verification'] = dict(old.get('verification', {}))
          manifest['verification']['version_correction'] = {
              'date': '2026-09-22', 'runtime_logic': 'Owner-tested R6 unchanged; version metadata only',
              'r6_package_sha256': '8d089d07728409132a55fbfb00dd6b1073d9307e734c51ea5cd5e498f1e9997c',
              'owner_report': 'All requested cargo, item-relocation and blocked-door gameplay checks passed before this metadata correction',
              'nuc_deployment': 'not performed by this Git update', 'workshop_upload': 'not performed'}
          assert prefix + 'release-3.8.10.json' not in entries
          patches['release-3.8.10.json'] = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode()
          readme = read('README.md').decode()
          readme,n = re.subn(r'^# Mobile Living 3\.8\.[0-9]+', '# Mobile Living 3.8.10', readme, count=1)
          assert n == 1
          readme = readme.replace('[release-3.8.8.json](release-3.8.8.json)',
                                  '[release-3.8.10.json](release-3.8.10.json)')
          readme += '\nVersion 3.8.10 contains the owner-tested R6 cargo and seat-access fixes.\nThe version correction does not change that gameplay logic. NUC deployment\nand Steam Workshop publication are separate steps; this source update does not perform them.\n'
          patches['README.md'] = readme.encode()
          patches['docs/release-3.8.10.md'] = ('# 3.8.10: version correction for tested R6\n\n'
              'Date: 2026-09-22. The owner corrected the release version from 3.8.9 to 3.8.10.\n'
              'The R6 cargo callback, seat-item relocation, automatic route filtering and action guards remain unchanged.\n'
              'Only the VLS version/build strings, KI5 version string, four mod.info version fields, current README and release manifest change.\n'
              'The prior 3.8.9 manifest is retained as a historical snapshot, not the active runtime manifest.\n'
              'NUC source and runtime deployment precede Workshop publication; no NUC or Workshop operation is performed by this Git change.\n').encode()
          assert len(patches) == 9
          assert call('/git/ref/heads/main')['object']['sha'] == parent, 'main moved; no branch update'
          changes = [{'path': prefix + p, 'mode':'100644', 'type':'blob', 'content': b.decode('utf-8')}
                     for p,b in sorted(patches.items())]
          new_tree = call('/git/trees', {'base_tree': commit['tree']['sha'], 'tree': changes})['sha']
          new_commit = call('/git/commits', {'message': 'chore(vls): correct tested R6 release version to 3.8.10',
                                            'tree': new_tree, 'parents': [parent]})['sha']
          call('/git/refs/heads/main', {'sha':new_commit, 'force':False}, 'PATCH')
          assert call('/git/ref/heads/main')['object']['sha'] == new_commit
          print('VERSION_CORRECTION_COMMITTED', new_commit)
          print('VERSION', manifest['version'], 'RUNTIME_FILES', len(hashes), 'RUNTIME_SHA256', manifest['runtime_sha256'])
          print('R6_CLIENT_UNCHANGED', hashes[client])
          PY
