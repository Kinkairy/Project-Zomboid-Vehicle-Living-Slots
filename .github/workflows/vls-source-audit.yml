name: VLS source audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lua syntax, catalogs and exact runtime manifest
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          find workshop/Contents/mods -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python3 tools/build_translations.py
          python3 tests/test_runtime_manifest.py
          python3 tools/check_runtime_manifest.py --core-manifest-output "$RUNNER_TEMP/vls-candidate-core.json"
      - name: Source-only regression suites
        run: |
          export LUA_PATH="$PWD/workshop/Contents/mods/VehicleLivingSlots/common/media/lua/shared/?.lua;$PWD/workshop/Contents/mods/VehicleLivingSlotsKI5F700/common/media/lua/shared/?.lua;;"
          # These existing fixtures provide their own engine stubs. The separate
          # cargo suite below loads and checks the actual pinned native callback.
          for name in test_roof_capacity test_roof_cargo_damage test_vls_boundaries test_vls_chassis test_vls_lights test_vls_material_tiers test_vls_regressions test_vls_trailer_fridge; do
            lua5.1 -e 'package.loaded["Vehicles/Vehicles"] = true' "tests/$name.lua" .
          done
          lua5.1 -e 'package.loaded["Vehicles/Vehicles"] = true' tests/test_vls_boundaries.lua . . Base.Mov_TrailerFridge
          lua5.1 tests/test_vls_f700_independent.lua . f700-first
          lua5.1 tests/test_vls_f700_independent.lua . campers-first
          lua5.1 tests/test_vls_f700_frames.lua .
          python3 tests/test_vls_f700_scripts.py --base-manifest "$RUNNER_TEMP/vls-candidate-core.json"
      - name: Native cargo callback contract regression
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          url = 'https://raw.githubusercontent.com/Project-Zomboid-Community-Modding/ProjectZomboid-Vanilla-Lua/15300b1307e8b27d01ef86f42aea5d9ac0196e99/server/Vehicles/Vehicles.lua'
          with urllib.request.urlopen(url, timeout=45) as response:
              data = response.read()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '220ef31821e210dd74cb84b214f10d4b514b1238'
          pathlib.Path('/tmp/vls-native-vehicles.lua').write_bytes(data)
          PY
          lua5.1 tests/test_native_cargo_3811.lua . /tmp/vls-native-vehicles.lua
