name: VLS source audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lua syntax, catalogs and exact runtime manifest
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          find workshop/Contents/mods -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python3 tools/build_translations.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('release-3.8.11.json').read_text())
          root = Path('workshop/Contents/mods')
          files = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in root.rglob('*') if p.is_file()}
          assert files == manifest['files']
          fingerprint = hashlib.sha256(''.join(value + '  ' + name + '\n'
              for name, value in sorted(files.items())).encode()).hexdigest()
          assert fingerprint == manifest['runtime_sha256']
          print('Runtime manifest verified:', len(files), fingerprint)
          PY
      - name: Source-only regression suites
        run: |
          # These existing fixtures provide their own engine stubs. The separate
          # cargo suite below loads and checks the actual pinned native callback.
          for name in test_roof_capacity test_roof_cargo_damage test_vls_boundaries test_vls_chassis test_vls_lights test_vls_material_tiers test_vls_regressions; do
            lua5.1 -e 'package.loaded["Vehicles/Vehicles"] = true' "tests/$name.lua" .
          done
      - name: Native cargo callback contract regression
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          url = 'https://raw.githubusercontent.com/Project-Zomboid-Community-Modding/ProjectZomboid-Vanilla-Lua/15300b1307e8b27d01ef86f42aea5d9ac0196e99/server/Vehicles/Vehicles.lua'
          with urllib.request.urlopen(url, timeout=45) as response:
              data = response.read()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '220ef31821e210dd74cb84b214f10d4b514b1238'
          pathlib.Path('/tmp/vls-native-vehicles.lua').write_bytes(data)
          PY
          lua5.1 tests/test_native_cargo_3811.lua . /tmp/vls-native-vehicles.lua
