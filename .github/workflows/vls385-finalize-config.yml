name: VLS 3.8.5 finalize accepted source

on:
  push:
    paths:
      - '.vls385-config-sync-trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify accepted 3.8.5 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, subprocess

          target = Path('workshop/Contents/mods/VehicleLivingSlots/common/media/lua/shared/VLS_Config.lua')
          parts = [Path(f'.vls385-config-parts/part0{i}') for i in range(1, 6)]
          for p in parts:
              assert p.is_file(), p
          target.write_bytes(b''.join(p.read_bytes() for p in parts))
          config_blob = subprocess.check_output(['git', 'hash-object', str(target)], text=True).strip()
          assert config_blob == '27293cda983fddec376ad6a193b7c037184b011e', config_blob

          runtime = Path('workshop/Contents/mods')
          files = sorted(p for p in runtime.rglob('*') if p.is_file())
          assert len(files) == 200, len(files)
          manifest = {}
          for p in files:
              manifest[p.relative_to(runtime).as_posix()] = hashlib.sha256(p.read_bytes()).hexdigest()
          data = {
              'schema': 2,
              'version': '3.8.5',
              'build': 'release-3.8.5-accepted-water-actionfix-20260918',
              'status': 'accepted-source-baseline',
              'workshop_item': '3791192579',
              'workshop_upload': False,
              'runtime_file_count': len(manifest),
              'files': manifest,
          }
          payload = (json.dumps(data, indent=2, ensure_ascii=False) + '\n').encode('utf-8')
          manifest_sha = hashlib.sha256(payload).hexdigest()
          assert manifest_sha == '04452e7cd9a4d0b8bd0cda0888aac0b0b23be8551204bb315829fb22d66177c0', manifest_sha
          release = Path('release-3.8.5.json')
          release.write_bytes(payload)
          release_blob = subprocess.check_output(['git', 'hash-object', str(release)], text=True).strip()
          assert release_blob == '8f293b3c06fdb21e020c6c373c01372a73d02ac9', release_blob

          shutil.rmtree('.vls385-config-parts')
          Path('.vls385-config-sync-trigger').unlink(missing_ok=True)
          Path('.github/workflows/vls385-finalize-config.yml').unlink(missing_ok=True)
          PY
          git config user.name 'Kinkairy VLS Release Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'release(vls): finalize accepted 3.8.5 source'
          git push
